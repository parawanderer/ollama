syntax = "proto3";

// A streaming chat completion, shaped like OpenAI's but without re-sending the invariant
// half of it on every token.
//
// OpenAI's chunk repeats id, object, created, model, system_fingerprint and a nested
// choices[0].delta wrapper for each token, so 224 bytes of envelope arrive with about 5
// bytes of text. Everything constant for a response is sent once here, in Start, and a
// token costs a tag, a length and its own bytes.
package slop.chat.v1;

// Sent once, before any Delta. These are the fields OpenAI repeats per chunk.
message Start {
  string id = 1;
  string model = 2;
  uint64 created = 3;
  string system_fingerprint = 4;
  string role = 5;  // "assistant"
}

// One token, or one step of one. Every field is optional -- proto3 has no other kind -- so
// a plain text delta costs a tag, a length and its bytes, and carries nothing for the rest.
message Delta {
  string content = 1;
  string reasoning = 2;

  // Present only on the chunks that carry them. A tool call arrives in pieces: the first
  // chunk for an index names the function, later ones append to arguments.
  repeated ToolCall tool_calls = 3;

  // Present only when the request asked for logprobs.
  repeated Logprob logprobs = 4;
}

message ToolCall {
  string id = 1;
  uint32 index = 2;
  string type = 3;  // "function"
  Function function = 4;
}

message Function {
  string name = 1;
  string arguments = 2;  // a JSON fragment, streamed in pieces
}

// One position in the output. Bytes is the token's raw representation, which is how a
// client reassembles text a token boundary splits in the middle of a character.
message TokenLogprob {
  string token = 1;
  double logprob = 2;
  repeated uint32 bytes = 3;
}

message Logprob {
  TokenLogprob token = 1;
  repeated TokenLogprob top_logprobs = 2;
}

// Sent once, after the last Delta.
message End {
  string finish_reason = 1;
  uint32 prompt_tokens = 2;
  uint32 completion_tokens = 3;
}

message Frame {
  oneof kind {
    Start start = 1;
    Delta delta = 2;
    End end = 3;
  }
}
